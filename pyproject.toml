[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamebooster"
version = "3.0.0"
description = "Windows game optimizer with a change journal: every system change is previewed, confirmed and revertable"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "AdamDruszad"}]
keywords = ["gaming", "windows", "optimizer", "performance", "cleaner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "customtkinter>=5.2,<7",
    "psutil>=5.9",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py"]   # NVIDIA GPU-hőmérséklet a Monitor oldalon
dev = ["pyinstaller>=6.0", "pytest>=7.0", "ruff"]

[project.scripts]
gamebooster = "main:main"

[project.urls]
Homepage = "https://github.com/AdamDruszad/pc-optimizer"
Issues = "https://github.com/AdamDruszad/pc-optimizer/issues"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["gamebooster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# BLE001: a napló, a mintavevő és a figyelőszál határán minden hibát naplózni kell, nem leállni.
# PLW1510: a visszatérési kódot a winapi.run() maga ellenőrzi.
ignore = ["BLE001", "PLW1510"]
